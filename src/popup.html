<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="hdr">
    <img class="mark" src="assets/meridian-mark.svg" alt="" />
    <div class="titlewrap">
      <strong>Meridian</strong>
      <span class="sub">Twitch chat on YouTube</span>
    </div>
    <span id="headerStatus"><span class="dot"></span><span id="headerStatusText">Anonymous</span></span>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab" data-tab="general">General</button>
    <button class="tab" data-tab="youtube">Site</button>
    <button class="tab" data-tab="chat">Chat</button>
    <button class="tab" data-tab="appearance">Appearance</button>
    <button class="tab" data-tab="hotkeys">Hotkeys</button>
  </div>

  <!-- General -->
  <section class="panel" data-tab="general">
    <div class="card conncard" title="Connect your Twitch account to send messages. Anonymous read only until connected">
      <div id="status"></div>
      <button id="connectTwitch">Connect</button>
      <button id="disconnectTwitch" class="secondary">Disconnect</button>
      <div class="hint" id="authMsg"></div>
      <div class="hint" id="redirectHelp"></div>
    </div>
    <div class="card" title="Master switch for Meridian across every site">
      <label class="row"><span>Extension enabled</span><input id="extensionEnabled" type="checkbox" /></label>
      <div class="hint">Inject Meridian on supported sites.</div>
    </div>
    <div class="card" title="How chat appears on this site, saved per site. Auto floats in fullscreen and docks otherwise">
      <label>Display mode (this site)</label>
      <select id="siteMode">
        <option value="auto">Auto (overlay in fullscreen, docked otherwise)</option>
        <option value="overlay">Overlay (floating)</option>
        <option value="docked">Docked (in the page)</option>
      </select>
    </div>
  </section>

  <!-- Site settings -->
  <section class="panel" data-tab="youtube">
    <div class="card" id="siteCard">
      <div id="siteEnabledLabel" style="font-weight:600; color:var(--fg-1);"></div>
      <div class="hint" id="siteHint"></div>
    </div>
    <div class="card" id="ytLoadOnCard" title="Choose whether the overlay loads on livestreams only or on every YouTube video">
      <label>Load chat on</label>
      <select id="ytLoadOn">
        <option value="live">Livestreams only</option>
        <option value="all">All videos</option>
      </select>
    </div>
    <div class="card" title="Keep the overlay inside the player, following theater and fullscreen">
      <label class="row"><span>Bind overlay to the video player</span><input id="boundToPlayer" type="checkbox" /></label>
    </div>
    <div class="card" title="Map this page's YouTube handle or Kick slug to a Twitch channel, joined automatically">
      <label>Channel → Twitch mappings (one per line: <code>handle = twitch_channel</code>)</label>
      <textarea id="mappings" rows="8" spellcheck="false" placeholder="@ESLCS = eslcs
xqc = xqc"></textarea>
      <button id="saveMappings">Save mappings</button>
      <span id="mappingsMsg" class="hint"></span>
    </div>
  </section>

  <!-- Chat -->
  <section class="panel" data-tab="chat">
    <div class="card" title="Delay incoming chat by this many seconds. Zero is realtime">
      <label>Chat delay (seconds)</label>
      <div class="row">
        <input id="delay" type="number" min="0" max="600" step="1" />
        <button id="saveDelay">Save</button>
      </div>
    </div>
    <div class="card" title="Choose which global and channel emote sets to display">
      <label>Third-party emotes</label>
      <label class="row"><span>7TV</span><input id="emote7tv" type="checkbox" /></label>
      <label class="row"><span>BetterTTV</span><input id="emoteBttv" type="checkbox" /></label>
      <label class="row"><span>FrankerFaceZ</span><input id="emoteFfz" type="checkbox" /></label>
    </div>
    <div class="card" title="Flush new messages in one batch every this many milliseconds. Zero renders instantly">
      <label>Render batching (ms; 0 = instant)</label>
      <div class="row">
        <input id="updateFreq" type="number" min="0" max="2000" step="50" />
        <button id="saveUpdateFreq">Save</button>
      </div>
    </div>
    <div class="card" title="Maximum messages kept in the chat view">
      <label>Max messages kept in view</label>
      <div class="row">
        <input id="maxMessages" type="number" min="50" max="2000" step="50" />
        <button id="saveMaxMessages">Save</button>
      </div>
    </div>
    <div class="card">
      <label class="row" title="Show a chat activity wave over the live seekbar on YouTube livestreams">
        <span>Highlight timeline (chat-activity wave)</span>
        <input id="highlightTimeline" type="checkbox" />
      </label>
      <label class="row" title="Place emote surges on the wave. Click one to jump to that moment">
        <span>Emote highlights (emotes on the wave)</span>
        <input id="highlightEnabled" type="checkbox" />
      </label>
      <label class="row" title="Color of the activity wave and emote markers">
        <span>Timeline color</span>
        <input id="highlightColor" type="color" />
      </label>
      <label class="row" title="Keep emote surge markers for this video and replay them on the VOD after the stream ends (matched by the video's URL)">
        <span>Retain emote highlights</span>
        <input id="highlightPersistEmotes" type="checkbox" />
      </label>
      <label class="row" title="Keep the chat-intensity wave for this video and replay it on the VOD after the stream ends (matched by the video's URL)">
        <span>Retain intensity timeline</span>
        <input id="highlightPersistDensity" type="checkbox" />
      </label>
      <div class="row">
        <button id="clearHighlightCache" class="secondary">Clear highlight cache</button>
        <span id="clearHighlightMsg" class="hint" style="width:auto;"></span>
      </div>
    </div>
    <details class="card" id="advancedCard">
      <summary>Advanced</summary>
      <label class="row" title="On keeps highlights at the live edge. Off keeps them at your playback position">
        <span>Anchor highlights to the live edge</span>
        <input id="highlightAnchorLive" type="checkbox" />
      </label>
      <label style="margin-top:10px;" title="Shift the wave and markers this many seconds into the past for reaction time">Highlight timeline offset (seconds)</label>
      <div class="row" title="Shift the wave and markers this many seconds into the past for reaction time">
        <input id="highlightOffset" type="number" min="0" max="120" step="1" />
        <button id="saveHighlightOffset">Save</button>
      </div>
      <label style="margin-top:10px;" title="Unique viewers needed within about twelve seconds to mark an emote surge">Threshold (unique viewers / ~12 s)</label>
      <div class="row" title="Unique viewers needed within about twelve seconds to mark an emote surge">
        <input id="highlightThreshold" type="number" min="3" max="100000" step="1" />
        <button id="saveHighlightThreshold">Save</button>
      </div>
    </details>
    <div class="card" title="Remove moderated messages instead of dimming them">
      <label class="row"><span>Hide deleted messages</span><input id="hideDeleted" type="checkbox" /></label>
    </div>
    <div class="card" title="Hide messages containing any of these words">
      <label>Blocked words (one per line, case-insensitive)</label>
      <textarea id="blockedWords" rows="6" spellcheck="false" placeholder="word1
word2"></textarea>
      <button id="saveBlockedWords">Save</button>
      <span id="blockedWordsMsg" class="hint"></span>
    </div>
  </section>

  <!-- Appearance -->
  <section class="panel" data-tab="appearance">
    <div class="card" title="Color of the activity wave and emote markers">
      <label>Timeline accent</label>
      <div class="row">
        <span style="flex:1; font-size:13.5px; color:var(--fg-2);">Glow color of the wave and surge stems.</span>
        <input id="highlightColorAppearance" type="color" />
      </div>
    </div>
    <div class="card">
      <label class="row" title="Show a translucent background behind chat"><span>Background color</span><input id="bgEnabled" type="checkbox" /></label>
      <label class="row" title="Blur the video behind the chat background"><span>Background blur</span><input id="blurEnabled" type="checkbox" /></label>
      <label class="row" title="Cast a drop shadow under the chat panel"><span>Drop shadow (panel)</span><input id="shadowEnabled" type="checkbox" /></label>
      <label class="row" title="Draw a thin border around the chat panel"><span>Background outline</span><input id="outlineEnabled" type="checkbox" /></label>
    </div>
    <div class="card">
      <label title="Add a drop shadow or outline to chat text for legibility over bright video">Text style</label>
      <select id="textStyle" title="Add a drop shadow or outline to chat text for legibility over bright video">
        <option value="none">None</option>
        <option value="shadow">Drop shadow</option>
        <option value="outline">Outline</option>
      </select>
      <label class="row"><span>Bold text</span><input id="boldText" type="checkbox" /></label>
    </div>
    <div class="card" title="Opacity of the chat background">
      <div class="sliderhead"><label style="width:auto;">Background opacity</label><span class="val" id="opacityVal"></span></div>
      <input id="opacity" type="range" min="0" max="100" step="1" />
    </div>
    <div class="card" title="Strength of the background blur in pixels">
      <div class="sliderhead"><label style="width:auto;">Background blur radius</label><span class="val" id="blurRadiusVal"></span></div>
      <input id="blurRadius" type="range" min="0" max="20" step="1" />
    </div>
    <div class="card" title="Chat text size in pixels">
      <label>Font size (px)</label>
      <div class="row">
        <input id="fontSize" type="number" min="10" max="24" step="1" />
        <button id="saveFontSize">Save</button>
      </div>
    </div>
  </section>

  <!-- Hotkeys -->
  <section class="panel" data-tab="hotkeys">
    <div class="card" title="Show or hide chat, the same as the close button and the chat bubble">
      <label>Toggle visibility</label>
      <div class="row">
        <input id="hotkeyToggle" placeholder="e.g. Alt+C (click then press combo)" readonly />
        <button id="hotkeyToggleCapture">Capture</button>
        <button id="hotkeyToggleClear" class="secondary">Clear</button>
      </div>
    </div>
    <div class="card" title="Show chat and place the cursor in the message box">
      <label>Focus input</label>
      <div class="row">
        <input id="hotkeyFocus" placeholder="e.g. Alt+F (click then press combo)" readonly />
        <button id="hotkeyFocusCapture">Capture</button>
        <button id="hotkeyFocusClear" class="secondary">Clear</button>
      </div>
      <div class="hint">Requires a modifier such as Ctrl Alt Shift or Meta. Saved globally.</div>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
